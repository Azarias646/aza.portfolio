# À copier dans .github/workflows/ci.yml pour activer la CI (voir README).
# Vérifications à chaque push et pull request : formatage, types (astro check) et construction.
# La mise en ligne elle-même est faite par Cloudflare Pages, relié au dépôt.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
